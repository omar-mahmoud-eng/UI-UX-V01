name: Legacy blueprint integrity — documentation only
on:
  push:
    branches: [main, "agent-os/**"]
  pull_request:
jobs:
  basic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Confirm original planning artifacts remain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
          "README.md", "AGENTS.md", "START_AGENT_AR.md",
          *[str(p) for p in sorted(Path("docs").glob("[0-2][0-9]-*.md"))],
          *[str(p) for p in sorted(Path("tasks").glob("F[0-9][0-9]-*.md"))]
          ]
          assert len(files) >= 30, f"insufficient plan files: {len(files)}"
          bad = [p for p in files if not Path(p).is_file() or not Path(p).read_text().strip()]
          assert not bad, f"missing or empty: {bad}"
          print(f"Static CommerceOS plan integrity PASS: {len(files)} files.")
          print("No application build/security/load test performed.")
          PY
